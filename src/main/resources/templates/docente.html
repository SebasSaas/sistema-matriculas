<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">
<head>
    <title>Docentes</title>
</head>
<body>

<div layout:fragment="content">
    <!-- Crear Docente -->
    <section class="card mb-4">
        <div class="card-header">
            <h2>Registrar Docente</h2>
        </div>
        <div class="card-body">
            <form th:action="@{/docentes/crear}" th:object="${nuevoDocente}" method="post" class="row g-3">
                <div class="col-md-6">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required>
                </div>
                <div class="col-md-6">
                    <label for="apellidos" class="form-label">Apellidos</label>
                    <input type="text" class="form-control" id="apellidos" th:field="*{apellidos}" required>
                </div>
                <div class="col-md-6">
                    <label for="fechaNacimiento" class="form-label">Fecha Nacimiento</label>
                    <input type="date" class="form-control" id="fechaNacimiento" th:field="*{fechaNacimiento}" required>
                </div>
                <div class="col-md-6">
                    <label for="sueldo" class="form-label">Sueldo</label>
                    <input type="number" step="0.01" class="form-control" id="sueldo" th:field="*{sueldo}" required>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </section>

    <!-- Mostrar Docentes -->
    <section class="card">
        <div class="card-header">
            <h2>Lista de Docentes</h2>
        </div>
        <div class="card-body">
            <table class="table table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellidos</th>
                        <th>Fecha Nacimiento</th>
                        <th>Sueldo</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="docente : ${docentes}">
                        <td th:text="${docente.id}"></td>
                        <td th:text="${docente.nombre}"></td>
                        <td th:text="${docente.apellidos}"></td>
                        <td th:text="${#dates.format(docente.fechaNacimiento, 'dd/MM/yyyy')}"></td>
                        <td th:text="${'S/ ' + #numbers.formatDecimal(docente.sueldo, 1, 2)}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</div>

</body>
</html>
